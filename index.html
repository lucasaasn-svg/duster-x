<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha IA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .topo {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .topo h1 {
            margin: 0;
        }

        .chat {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        #resposta {
            min-height: 300px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h1>duster-x</h1>
        <p>Faça sua pergunta</p>
    </div>

    <div class="chat">

        <div id="resposta">
            A resposta da IA aparecerá aqui.
        </div>

        <textarea id="pergunta" placeholder="Digite sua pergunta..."></textarea>
<button type="button" onclick="ouvir()">🎤 Falar</button>
        <button onclick="perguntar()">Perguntar</button>

    </div>

    <script>
        async function perguntar() {

            const pergunta = document.getElementById("pergunta").value;
            const resposta = document.getElementById("resposta");

            if (pergunta.trim() === "") {
                resposta.innerText = "Digite uma pergunta primeiro.";
                return;
            }

            resposta.innerText = "Pensando...";

            try {

                const resultado = await fetch("/perguntar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pergunta: pergunta
                    })
                });

                const dados = await resultado.json();

                resposta.innerText = dados.resposta;

            } catch (erro) {

                resposta.innerText =
                    "Não consegui conectar com a IA. Verifique se o programa está funcionando.";

            }
        }function ouvir() {

    const pergunta = document.getElementById("pergunta");

    const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Reconhecimento) {
        alert("Seu navegador não suporta reconhecimento de voz.");
        return;
    }

    const reconhecimento = new Reconhecimento();

    reconhecimento.lang = "pt-BR";
    reconhecimento.continuous = false;
    reconhecimento.interimResults = false;

    reconhecimento.onstart = function() {
        pergunta.placeholder = "Estou ouvindo...";
    };

    reconhecimento.onresult = function(event) {

        const texto = event.results[0][0].transcript;

        pergunta.value = texto;
    };

    reconhecimento.onerror = function() {
        pergunta.placeholder = "Não consegui ouvir. Tente novamente.";
    };

    reconhecimento.onend = function() {
        pergunta.placeholder = "Digite sua pergunta...";
    };

    reconhecimento.start();
}
    </script>

</body>
</html>
